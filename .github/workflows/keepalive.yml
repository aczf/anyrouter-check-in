name: Keepalive Workflow

on:
  schedule:
    # 每月 1 号和 15 号凌晨 0 点运行一次
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Keepalive
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
